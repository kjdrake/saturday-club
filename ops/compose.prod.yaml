services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: saturday-club-app
    restart: unless-stopped
    env_file: /opt/saturday-club/runtime.env
    environment:
      DATABASE_PATH: /data/club.db
      COOKIE_SECURE: 'true'
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - /srv/saturday-club/league:/data
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  scores:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: saturday-club-scores
    command: [python, sync.py]
    restart: unless-stopped
    env_file: /opt/saturday-club/runtime.env
    environment:
      DATABASE_PATH: /data/club.db
    volumes:
      - /srv/saturday-club/league:/data
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
  https:
    image: caddy:2-alpine
    container_name: saturday-club-https
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/saturday-club/caddy-data:/data
      - /srv/saturday-club/caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
